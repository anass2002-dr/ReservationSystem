<div class="pagetitle">
  <h1>Flight Packages Management</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item">Logistics & Packages</li>
      <li class="breadcrumb-item active">Flight Packages</li>
    </ol>
  </nav>
</div>

<section class="section dashboard">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Flight Packages List
            <button class="btn btn-primary btn-sm float-end" (click)="addFlightPackage()"><i class="bi bi-plus-lg"></i> Add Package</button>
          </h5>
          
          <table class="table table-striped table-hover datatable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Price</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              @for (fp of flightPackages; track fp.id) {
              <tr>
                <th scope="row">{{fp.id}}</th>
                <td>{{fp.title}}</td>
                <td>{{fp.price | currency}}</td>
                <td>
                  <button class="btn btn-sm btn-info me-2" (click)="editFlightPackage(fp)"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger" (click)="deleteFlightPackage(fp.id!)"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              }
              @empty {
              <tr>
                <td colspan="4" class="text-center">No flight packages found.</td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
