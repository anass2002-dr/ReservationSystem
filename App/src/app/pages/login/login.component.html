<div class="login-page">
  <div class="login-container">
    <div class="login-card shadow-lg">
      <div class="login-header">
        <div class="logo">
          <i class="bi bi-airplane-engines-fill"></i>
        </div>
        <h3>Welcome Back</h3>
        <p class="text-muted">Reservation Management System</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-body">
        <div class="mb-4">
          <label class="form-label small fw-bold text-uppercase">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
            <input type="text" name="username" [(ngModel)]="username" class="form-control border-0 bg-light" placeholder="Enter your username" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-uppercase">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" [(ngModel)]="password" class="form-control border-0 bg-light" placeholder="Enter your password" required>
          </div>
        </div>

        <div *ngIf="error" class="alert alert-danger py-2 small mb-4">
          <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
        </div>

        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <div class="login-footer text-center mt-4">
        <p class="text-muted small">© 2026 ReservationSystem. All rights reserved.</p>
      </div>
    </div>
  </div>
</div>
