<div class="login-page-container">
  <!-- Subtle ambient light orbs -->
  <div class="ambient-orb ambient-orb-1"></div>
  <div class="ambient-orb ambient-orb-2"></div>

  <div class="login-card shadow-sm">
    <!-- Header: Logo & Title -->
    <div class="text-center mb-4">
      <div class="brand-logo-wrapper mx-auto mb-3">
        <img src="assets/img/NewLogo.png" alt="Reservation System Logo" class="brand-logo-img" (error)="logoFallback.style.display='flex'" #logoImg>
        <div class="brand-logo-fallback" style="display: none;" #logoFallback>
          <i class="bi bi-airplane-engines-fill"></i>
        </div>
      </div>
      <h2 class="login-title">Sign In</h2>
      <p class="login-subtitle">Enter your credentials to access your account</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form" novalidate>
      <!-- Username Field -->
      <div class="form-group mb-3">
        <label class="form-label" for="login-username">
          Username
        </label>
        <div class="custom-input-wrap">
          <span class="input-icon">
            <i class="bi bi-person"></i>
          </span>
          <input
            type="text"
            id="login-username"
            name="username"
            [(ngModel)]="username"
            class="form-control custom-input"
            placeholder="Enter username"
            required
            autocomplete="username"
            [disabled]="loading">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group mb-4">
        <label class="form-label" for="login-password">
          Password
        </label>
        <div class="custom-input-wrap">
          <span class="input-icon">
            <i class="bi bi-lock"></i>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="login-password"
            name="password"
            [(ngModel)]="password"
            class="form-control custom-input pe-5"
            placeholder="Enter password"
            required
            autocomplete="current-password"
            [disabled]="loading">
          <button
            type="button"
            class="btn-toggle-password"
            (click)="toggleShowPassword()"
            tabindex="-1"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            title="Toggle password visibility">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Error Alert Banner -->
      <div *ngIf="error" class="custom-alert alert d-flex align-items-center mb-3 animate-fade" role="alert">
        <i class="bi bi-exclamation-circle-fill fs-5 me-2 flex-shrink-0"></i>
        <div>{{ error }}</div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        id="login-submit-btn"
        class="btn btn-primary-submit w-100 rounded-pill fw-semibold text-white"
        [disabled]="loading || !username || !password">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span *ngIf="!loading"><i class="bi bi-box-arrow-in-right me-2"></i></span>
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <!-- Footer Copyright -->
    <div class="login-footer text-center mt-4 pt-3">
      <p class="copyright-text mb-0">
        © 2026 <strong>Anass dermaj</strong>. All rights reserved.
      </p>
    </div>
  </div>
</div>
