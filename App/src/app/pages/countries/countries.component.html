<div class="pagetitle">
  <h1>Countries Management</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item">Settings & Info</li>
      <li class="breadcrumb-item active">Countries</li>
    </ol>
  </nav>
</div>

<section class="section dashboard">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Countries List
            <button class="btn btn-primary btn-sm float-end" (click)="addCountry()"><i class="bi bi-plus-lg"></i> Add Country</button>
          </h5>
          
          <table class="table table-striped table-hover datatable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Code</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let c of countries">
                <th scope="row">{{c.id}}</th>
                <td>{{c.name}}</td>
                <td>{{c.code}}</td>
                <td>
                  <button class="btn btn-sm btn-info me-2" (click)="editCountry(c)"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger" (click)="deleteCountry(c.id!)"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              <tr *ngIf="countries.length === 0">
                <td colspan="4" class="text-center">No countries found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Country Modal -->
<div class="modal fade" id="countryModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit Country' : 'Add Country' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <form (ngSubmit)="saveCountry()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="countryName" class="form-label">Name</label>
            <input type="text" class="form-control" id="countryName" name="name" [(ngModel)]="currentCountry.name" required>
          </div>
          <div class="mb-3">
            <label for="countryCode" class="form-label">Code</label>
            <input type="text" class="form-control" id="countryCode" name="code" [(ngModel)]="currentCountry.code" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
