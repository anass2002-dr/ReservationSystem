<div class="pagetitle">
  <h1>Extra Services Management</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item">Logistics & Packages</li>
      <li class="breadcrumb-item active">Extra Services</li>
    </ol>
  </nav>
</div>

<section class="section dashboard">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Extra Services List
            <button class="btn btn-primary btn-sm float-end" (click)="addExtraService()"><i class="bi bi-plus-lg"></i> Add Service</button>
          </h5>
          
          <table class="table table-striped table-hover datatable">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Price</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
              @for (es of extraServices; track es.id) {
              <tr>
                <th scope="row">{{es.id}}</th>
                <td>{{es.name}}</td>
                <td>{{es.price | currency}}</td>
                <td>
                  <button class="btn btn-sm btn-info me-2" (click)="editExtraService(es)"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger" (click)="deleteExtraService(es.id!)"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
              }
              @empty {
              <tr>
                <td colspan="4" class="text-center">No extra services found.</td>
              </tr>
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
