<div class="pagetitle">
  <h1>Pilots Management</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
      <li class="breadcrumb-item">Entities</li>
      <li class="breadcrumb-item active">Pilots</li>
    </ol>
  </nav>
</div>

<section class="section dashboard">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Pilots List
            <button class="btn btn-primary btn-sm float-end" (click)="addPilot()"><i class="bi bi-plus-lg"></i> Add Pilot</button>
          </h5>
          
          <div class="table-responsive">
            <table class="table table-striped table-hover datatable">
              <thead>
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Full Name</th>
                  <th scope="col">License Number</th>
                  <th scope="col">Status</th>
                  <th scope="col">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let p of pilots">
                  <th scope="row">{{p.id}}</th>
                  <td>{{p.fullName}}</td>
                  <td>{{p.licenseNumber}}</td>
                  <td><span class="badge {{getStatusBadgeClass(p.status)}}">{{getStatusLabel(p.status)}}</span></td>
                  <td>
                    <button class="btn btn-sm btn-info me-2" (click)="editPilot(p)"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-danger" (click)="deletePilot(p.id!)"><i class="bi bi-trash"></i></button>
                  </td>
                </tr>
                <tr *ngIf="pilots.length === 0">
                  <td colspan="5" class="text-center">No pilots found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Pilot Modal -->
<div class="modal fade" id="pilotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit Pilot' : 'Add Pilot' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <form (ngSubmit)="savePilot()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" name="fullName" [(ngModel)]="currentPilot.fullName" required>
          </div>
          <div class="mb-3">
            <label for="licenseNumber" class="form-label">License Number</label>
            <input type="text" class="form-control" id="licenseNumber" name="licenseNumber" [(ngModel)]="currentPilot.licenseNumber" required>
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status" [(ngModel)]="currentPilot.status" required>
              <option *ngFor="let opt of statusOptions" [ngValue]="opt.value">{{ opt.label }}</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
