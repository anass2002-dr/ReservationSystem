<div class="sidebar-backdrop" (click)="closeMobileSidebar()"></div>
<aside id="sidebar" class="sidebar toggle-sidebar2" (mousedown)="sidebar_mouse_event()">
  <ul class="sidebar-nav" id="sidebar-nav">
    <li class="nav-item">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileSidebar()">
        <i class="bi bi-grid"></i>
        <span class="toggle-sidebar_text">Dashboard</span>
      </a>
    </li>

    <li class="nav-heading">Core</li>

    <li class="nav-item">
      <a class="nav-link collapsed" routerLink="/reservations" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileSidebar()">
        <i class="bi bi-calendar-check"></i>
        <span class="toggle-sidebar_text">Reservations</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link collapsed" routerLink="/Customers" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileSidebar()">
        <i class="bi bi-people"></i>
        <span class="toggle-sidebar_text">Customers</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link collapsed" routerLink="/agencies" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileSidebar()">
        <i class="bi bi-building"></i>
        <span class="toggle-sidebar_text">Agencies</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link collapsed" routerLink="/payments" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileSidebar()">
        <i class="bi bi-cash-stack"></i>
        <span class="toggle-sidebar_text">Payments</span>
      </a>
    </li>

    <li class="nav-item">
      <a class="nav-link collapsed" routerLink="/exchange-rates" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: false}" (click)="closeMobileSidebar()">
        <i class="bi bi-currency-exchange"></i>
        <span class="toggle-sidebar_text">Exchange Rates</span>
      </a>
    </li>

    <li class="nav-heading">Setup</li>

    <li class="nav-item">
      <a class="nav-link collapsed" data-bs-target="#setup-nav" data-bs-toggle="collapse" href="#">
        <i class="bi bi-gear"></i><span class="toggle-sidebar_text">Configuration</span>
        <i class="bi bi-chevron-down toggle-sidebar_text ms-auto"></i>
      </a>
      <ul id="setup-nav" class="nav-content collapse" data-bs-parent="#sidebar-nav">

        <li>
          <a routerLink="/pilots" routerLinkActive="active" (click)="closeMobileSidebar()">
            <i class="bi bi-circle"></i><span class="toggle-sidebar_text">Pilots</span>
          </a>
        </li>
        <li>
          <a routerLink="/transport-groups" routerLinkActive="active" (click)="closeMobileSidebar()">
            <i class="bi bi-circle"></i><span class="toggle-sidebar_text">Transport Groups</span>
          </a>
        </li>
        <li>
          <a routerLink="/flight-packages" routerLinkActive="active" (click)="closeMobileSidebar()">
            <i class="bi bi-circle"></i><span class="toggle-sidebar_text">Flight Packages</span>
          </a>
        </li>
        <li>
          <a routerLink="/extra-services" routerLinkActive="active" (click)="closeMobileSidebar()">
            <i class="bi bi-circle"></i><span class="toggle-sidebar_text">Extra Services</span>
          </a>
        </li>
        <li>
          <a routerLink="/flight-times" routerLinkActive="active" (click)="closeMobileSidebar()">
            <i class="bi bi-circle"></i><span class="toggle-sidebar_text">Flight Times</span>
          </a>
        </li>
      </ul>
    </li>

    <li class="nav-heading" *ngIf="authService.isAdmin()">Admin</li>

    <li class="nav-item" *ngIf="authService.isAdmin()">
      <a class="nav-link collapsed" routerLink="/admin/users" routerLinkActive="active" (click)="closeMobileSidebar()">
        <i class="bi bi-person-badge"></i>
        <span class="toggle-sidebar_text">Manage Users</span>
      </a>
    </li>

    <li class="nav-heading">Help</li>

    <li class="nav-item">
      <a class="nav-link collapsed" href="assets/manual/SYSTEM_USER_MANUAL.html" target="_blank" (click)="closeMobileSidebar()" title="System User Manual">
        <i class="bi bi-book"></i>
        <span class="toggle-sidebar_text">User Manual</span>
        <i class="bi bi-box-arrow-up-right toggle-sidebar_text ms-auto small text-muted"></i>
      </a>
    </li>
  </ul>

</aside>
